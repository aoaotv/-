<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>プロジェクターお絵かきボード</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: white;
    font-family: sans-serif;
}

#video {
    position: fixed;
    right: 10px;
    bottom: 10px;
    width: 240px;
    border: 3px solid black;
    border-radius: 10px;
    transform: scaleX(-1);
    z-index: 10;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: white;
}

#ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 20;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

button, select {
    font-size: 18px;
    padding: 10px 15px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
}

select {
    background: #444;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="canvas"></canvas>

<div id="ui">

    <select id="cameraSelect">
        <option>カメラを選択</option>
    </select>

    <button id="switchButton">
        📷 カメラ切り替え
    </button>

    <button id="mirrorButton">
        ↔️ 左右反転
    </button>

    <button onclick="clearCanvas()">
        🗑️ 消す
    </button>

    <button onclick="changeColor()">
        🎨 色
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const cameraSelect =
    document.getElementById("cameraSelect");

const switchButton =
    document.getElementById("switchButton");

const mirrorButton =
    document.getElementById("mirrorButton");


let currentStream = null;

let color = "black";

let lastX = null;
let lastY = null;

// 左右反転状態
let mirrored = true;


// ======================
// キャンバス
// ======================

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


// ======================
// カメラ一覧取得
// ======================

async function getCameras() {

    try {

        const temp =
            await navigator.mediaDevices.getUserMedia({
                video: true
            });

        temp.getTracks().forEach(track => {
            track.stop();
        });

    } catch (error) {

        alert("カメラへのアクセスを許可してください");

        return;

    }


    const devices =
        await navigator.mediaDevices.enumerateDevices();


    const cameras =
        devices.filter(device =>
            device.kind === "videoinput"
        );


    cameraSelect.innerHTML = "";


    cameras.forEach((camera, index) => {

        const option =
            document.createElement("option");

        option.value = camera.deviceId;

        option.textContent =
            camera.label ||
            `カメラ ${index + 1}`;

        cameraSelect.appendChild(option);

    });


    if (cameras.length > 0) {

        startCamera(
            cameras[0].deviceId
        );

    }

}


// ======================
// カメラ開始
// ======================

async function startCamera(deviceId) {

    if (currentStream) {

        currentStream
            .getTracks()
            .forEach(track => track.stop());

    }


    try {

        currentStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    deviceId: {
                        exact: deviceId
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                }

            });


        video.srcObject = currentStream;

        // 新しいカメラにしたら線を一度切る
        lastX = null;
        lastY = null;

    } catch (error) {

        console.error(error);

        alert("カメラを起動できませんでした");

    }

}


// ======================
// カメラ切り替え
// ======================

switchButton.addEventListener(
    "click",
    async () => {

        const options =
            Array.from(cameraSelect.options);

        if (options.length <= 1) {
            return;
        }


        let index =
            cameraSelect.selectedIndex;

        index++;


        if (index >= options.length) {
            index = 0;
        }


        cameraSelect.selectedIndex =
            index;


        await startCamera(
            cameraSelect.value
        );

    }
);


// 選択欄から変更
cameraSelect.addEventListener(
    "change",
    () => {

        startCamera(
            cameraSelect.value
        );

    }
);


// ======================
// 左右反転
// ======================

mirrorButton.addEventListener(
    "click",
    () => {

        mirrored = !mirrored;


        if (mirrored) {

            video.style.transform =
                "scaleX(-1)";

            mirrorButton.textContent =
                "↔️ 左右反転 ON";

        } else {

            video.style.transform =
                "scaleX(1)";

            mirrorButton.textContent =
                "↔️ 左右反転 OFF";

        }


        // 反転切り替え直後に
        // 変な線が出ないようにする
        lastX = null;
        lastY = null;

    }
);


// ======================
// 色変更
// ======================

function changeColor() {

    const colors = [
        "black",
        "red",
        "blue",
        "green",
        "orange",
        "purple"
    ];


    let index =
        colors.indexOf(color);

    index++;


    if (index >= colors.length) {
        index = 0;
    }


    color = colors[index];

}


// ======================
// 全消去
// ======================

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

}


// ======================
// MediaPipe Hands
// ======================

const hands = new Hands({

    locateFile: (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.7,

    minTrackingConfidence: 0.7

});


// ======================
// 手を検出
// ======================

hands.onResults((results) => {

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        lastX = null;
        lastY = null;

        return;

    }


    const hand =
        results.multiHandLandmarks[0];


    // 人差し指の先端
    const finger = hand[8];


    // 左右反転に合わせて座標変更
    const x =
        (mirrored
            ? (1 - finger.x)
            : finger.x
        ) * canvas.width;


    const y =
        finger.y * canvas.height;


    // 人差し指が伸びているか
    const isIndexFingerUp =
        hand[8].y < hand[6].y;


    if (isIndexFingerUp) {

        if (
            lastX !== null &&
            lastY !== null
        ) {

            ctx.beginPath();

            ctx.moveTo(
                lastX,
                lastY
            );

            ctx.lineTo(
                x,
                y
            );

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                8;

            ctx.lineCap =
                "round";

            ctx.stroke();

        }


        lastX = x;
        lastY = y;

    } else {

        lastX = null;
        lastY = null;

    }

});


// ======================
// カメラ映像を処理
// ======================

async function processCamera() {

    if (video.readyState >= 2) {

        await hands.send({
            image: video
        });

    }

    requestAnimationFrame(
        processCamera
    );

}


// ======================
// 起動
// ======================

getCameras();

processCamera();

</script>

</body>
</html>
