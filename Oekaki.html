<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>プロジェクターお絵かきボード</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: white;
    font-family: sans-serif;
}

/* =====================
   お絵かきキャンバス
===================== */

#canvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    background: white;

    z-index: 1;
}


/* =====================
   カメラ映像
===================== */

#video {

    position: fixed;

    right: 10px;
    bottom: 10px;

    width: 240px;

    border: 3px solid black;

    border-radius: 10px;

    z-index: 5;

    transform: scaleX(-1);

}


/* =====================
   操作パネル
===================== */

#ui {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 20;

    display: flex;

    gap: 8px;

    align-items: center;

    flex-wrap: wrap;

}


/* =====================
   ボタン
===================== */

button {

    font-size: 18px;

    padding: 10px 15px;

    border: none;

    border-radius: 12px;

    background: #222;

    color: white;

}


/* =====================
   ズームバー
===================== */

#zoomBox {

    position: fixed;

    right: 10px;
    bottom: 270px;

    z-index: 20;

    background: rgba(0,0,0,0.7);

    color: white;

    padding: 10px;

    border-radius: 12px;

}

#zoomSlider {

    width: 200px;

}


/* =====================
   削除モード
===================== */

#deleteMode.active {

    background: #d22;

}


/* =====================
   操作UI非表示
===================== */

.hidden {

    display: none !important;

}

</style>
</head>

<body>


<!-- =====================
     お絵かきキャンバス
===================== -->

<canvas id="canvas"></canvas>


<!-- =====================
     カメラ
===================== -->

<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =====================
     操作パネル
===================== -->

<div id="ui">

    <select id="cameraSelect">

        <option>
            カメラを選択
        </option>

    </select>


    <button id="switchButton">
        📷 カメラ
    </button>


    <button id="mirrorButton">
        ↔️ 反転
    </button>


    <button id="deleteMode">
        🧹 削除モード
    </button>


    <button id="clearButton">
        🗑️ 全消去
    </button>


    <button id="colorButton">
        🎨 色
    </button>


    <button id="hideButton">
        🖥️ ボタンを隠す
    </button>

</div>


<!-- =====================
     ズームバー
===================== -->

<div id="zoomBox">

    🔍 カメラズーム

    <br>

    <input
        id="zoomSlider"
        type="range"
        min="0.5"
        max="3"
        step="0.1"
        value="1">

    <span id="zoomValue">
        1.0x
    </span>

</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>


// =====================
// 基本
// =====================

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const cameraSelect =
    document.getElementById("cameraSelect");


const switchButton =
    document.getElementById("switchButton");


const mirrorButton =
    document.getElementById("mirrorButton");


const deleteMode =
    document.getElementById("deleteMode");


const clearButton =
    document.getElementById("clearButton");


const colorButton =
    document.getElementById("colorButton");


const hideButton =
    document.getElementById("hideButton");


const zoomSlider =
    document.getElementById("zoomSlider");


const zoomValue =
    document.getElementById("zoomValue");


let currentStream = null;


let color = "black";


let mirrored = true;


let deleting = false;


let lastX = null;

let lastY = null;


let cameraZoom = 1;


// =====================
// キャンバスサイズ
// =====================

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


// =====================
// カメラ一覧
// =====================

async function getCameras() {

    try {

        const temp =
            await navigator.mediaDevices
            .getUserMedia({
                video: true
            });


        temp.getTracks()
        .forEach(track =>
            track.stop()
        );

    } catch (error) {

        alert(
            "カメラへのアクセスを許可してください"
        );

        return;

    }


    const devices =
        await navigator.mediaDevices
        .enumerateDevices();


    const cameras =
        devices.filter(
            device =>
            device.kind === "videoinput"
        );


    cameraSelect.innerHTML = "";


    cameras.forEach(
        (camera, index) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                camera.deviceId;


            option.textContent =
                camera.label ||
                `カメラ ${index + 1}`;


            cameraSelect.appendChild(
                option
            );

        }
    );


    if (cameras.length > 0) {

        startCamera(
            cameras[0].deviceId
        );

    }

}


// =====================
// カメラ開始
// =====================

async function startCamera(
    deviceId
) {

    if (currentStream) {

        currentStream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

    }


    try {

        currentStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    deviceId: {
                        exact: deviceId
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                }

            });


        video.srcObject =
            currentStream;


        lastX = null;
        lastY = null;


    } catch (error) {

        console.error(error);

        alert(
            "カメラを起動できませんでした"
        );

    }

}


// =====================
// カメラ切り替え
// =====================

switchButton.onclick =
async function () {

    const options =
        Array.from(
            cameraSelect.options
        );


    if (options.length <= 1)
        return;


    let index =
        cameraSelect.selectedIndex;


    index++;


    if (index >= options.length)
        index = 0;


    cameraSelect.selectedIndex =
        index;


    startCamera(
        cameraSelect.value
    );

};


// 選択変更
cameraSelect.onchange =
function () {

    startCamera(
        cameraSelect.value
    );

};


// =====================
// 左右反転
// =====================

mirrorButton.onclick =
function () {

    mirrored =
        !mirrored;


    updateVideoTransform();


    mirrorButton.textContent =
        mirrored
        ? "↔️ 反転 ON"
        : "↔️ 反転 OFF";


    lastX = null;
    lastY = null;

};


// =====================
// カメラ表示更新
// =====================

function updateVideoTransform() {

    video.style.transform =
        `${mirrored ? "scaleX(-1)" : "scaleX(1)"} scale(${cameraZoom})`;

}


// =====================
// ズームバー
// =====================

zoomSlider.oninput =
function () {

    cameraZoom =
        parseFloat(
            zoomSlider.value
        );


    zoomValue.textContent =
        cameraZoom.toFixed(1) + "x";


    updateVideoTransform();

};


// =====================
// 色変更
// =====================

const colors = [

    "black",
    "red",
    "blue",
    "green",
    "orange",
    "purple"

];


colorButton.onclick =
function () {

    let index =
        colors.indexOf(color);


    index++;


    if (index >= colors.length)
        index = 0;


    color =
        colors[index];


    colorButton.textContent =
        "🎨 " + color;

};


// =====================
// 削除モード
// =====================

deleteMode.onclick =
function () {

    deleting =
        !deleting;


    deleteMode.classList.toggle(
        "active",
        deleting
    );


    deleteMode.textContent =
        deleting
        ? "🧹 削除モード ON"
        : "🧹 削除モード";

};


// =====================
// 全消去
// =====================

clearButton.onclick =
function () {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

};


// =====================
// ボタンを隠す
// =====================

hideButton.onclick =
function () {

    document
    .getElementById("ui")
    .classList.add("hidden");


    document
    .getElementById("zoomBox")
    .classList.add("hidden");

};


// =====================
// MediaPipe
// =====================

const hands =
    new Hands({

        locateFile:
        (file) => {

            return
            `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.7,

    minTrackingConfidence: 0.7

});


// =====================
// 手を検出
// =====================

hands.onResults(
function (results) {


    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        lastX = null;
        lastY = null;

        return;

    }


    const hand =
        results.multiHandLandmarks[0];


    // 人差し指
    const finger =
        hand[8];


    const x =
        (
            mirrored
            ? 1 - finger.x
            : finger.x
        )
        * canvas.width;


    const y =
        finger.y
        * canvas.height;


    // 指が伸びているか
    const isIndexUp =
        hand[8].y <
        hand[6].y;


    if (!isIndexUp) {

        lastX = null;
        lastY = null;

        return;

    }


    if (
        lastX !== null &&
        lastY !== null
    ) {


        ctx.beginPath();


        ctx.moveTo(
            lastX,
            lastY
        );


        ctx.lineTo(
            x,
            y
        );


        if (deleting) {

            // 消しゴム
            ctx.globalCompositeOperation =
                "destination-out";


            ctx.lineWidth =
                40;

        } else {

            ctx.globalCompositeOperation =
                "source-over";


            ctx.strokeStyle =
                color;


            ctx.lineWidth =
                8;

        }


        ctx.lineCap =
            "round";


        ctx.stroke();


        ctx.globalCompositeOperation =
            "source-over";

    }


    lastX = x;
    lastY = y;


});


// =====================
// カメラ処理
// =====================

async function processCamera() {

    if (
        video.readyState >= 2
    ) {

        await hands.send({
            image: video
        });

    }


    requestAnimationFrame(
        processCamera
    );

}


// =====================
// 起動
// =====================

getCameras();

processCamera();

</script>

</body>
</html>
