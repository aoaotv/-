<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>プロジェクターお絵かきボード</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
    font-family: sans-serif;
}


/* =========================
   お絵かきキャンバス
========================= */

#canvas {

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    background: white;

    z-index: 1;
}


/* =========================
   カメラ表示
========================= */

#video {

    position: fixed;

    right: 10px;
    bottom: 10px;

    width: 240px;
    height: auto;

    border: 3px solid black;

    border-radius: 10px;

    background: black;

    z-index: 10;

}


/* =========================
   操作パネル
========================= */

#ui {

    position: fixed;

    top: 15px;
    left: 15px;

    z-index: 20;

    display: flex;

    gap: 8px;

    align-items: center;

    flex-wrap: wrap;

}


/* =========================
   ボタン
========================= */

button,
select {

    font-size: 18px;

    padding: 10px 15px;

    border: none;

    border-radius: 12px;

    background: #222;

    color: white;

    cursor: pointer;

}


button:hover {

    background: #444;

}


select {

    background: #444;

}


/* =========================
   ズームバー
========================= */

#zoomBox {

    position: fixed;

    right: 10px;
    bottom: 280px;

    z-index: 20;

    background: rgba(0,0,0,0.75);

    color: white;

    padding: 12px;

    border-radius: 12px;

}


#zoomSlider {

    width: 220px;

}


#zoomValue {

    display: inline-block;

    width: 45px;

    text-align: right;

}


/* =========================
   削除モードON
========================= */

#deleteMode.active {

    background: #d00000;

}

</style>
</head>


<body>


<!-- =========================
     お絵かきキャンバス
========================= -->

<canvas id="canvas"></canvas>


<!-- =========================
     Webカメラ
========================= -->

<video
    id="video"
    autoplay
    playsinline>
</video>


<!-- =========================
     操作ボタン
========================= -->

<div id="ui">

    <select id="cameraSelect">

        <option>
            カメラを選択
        </option>

    </select>


    <button id="switchButton">
        📷 カメラ切り替え
    </button>


    <button id="mirrorButton">
        ↔️ 反転 ON
    </button>


    <button id="deleteMode">
        🧹 削除モード
    </button>


    <button id="clearButton">
        🗑️ 全消去
    </button>


    <button id="colorButton">
        🎨 黒
    </button>

</div>


<!-- =========================
     認識範囲ズーム
========================= -->

<div id="zoomBox">

    🔍 認識範囲ズーム

    <br>

    <input
        id="zoomSlider"
        type="range"
        min="1"
        max="4"
        step="0.1"
        value="1">

    <span id="zoomValue">
        1.0x
    </span>

</div>


<!-- MediaPipe Hands -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>


// =====================================================
// 基本設定
// =====================================================

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const cameraSelect =
    document.getElementById("cameraSelect");


const switchButton =
    document.getElementById("switchButton");


const mirrorButton =
    document.getElementById("mirrorButton");


const deleteMode =
    document.getElementById("deleteMode");


const clearButton =
    document.getElementById("clearButton");


const colorButton =
    document.getElementById("colorButton");


const zoomSlider =
    document.getElementById("zoomSlider");


const zoomValue =
    document.getElementById("zoomValue");


// =====================================================
// 状態
// =====================================================

let currentStream = null;

let mirrored = true;

let deleting = false;

let color = "black";

let lastX = null;

let lastY = null;


// =====================================================
// キャンバスサイズ
// =====================================================

function resizeCanvas() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);


// =====================================================
// カメラ一覧
// =====================================================

async function getCameras() {

    try {

        const temp =
            await navigator.mediaDevices
            .getUserMedia({
                video: true
            });


        temp.getTracks()
        .forEach(track => {
            track.stop();
        });

    }

    catch (error) {

        alert(
            "カメラへのアクセスを許可してください"
        );

        return;

    }


    const devices =
        await navigator.mediaDevices
        .enumerateDevices();


    const cameras =
        devices.filter(
            device =>
            device.kind === "videoinput"
        );


    cameraSelect.innerHTML = "";


    cameras.forEach(
        (camera, index) => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                camera.deviceId;


            option.textContent =
                camera.label ||
                `カメラ ${index + 1}`;


            cameraSelect.appendChild(
                option
            );

        }
    );


    if (cameras.length > 0) {

        startCamera(
            cameras[0].deviceId
        );

    }

}


// =====================================================
// カメラ開始
// =====================================================

async function startCamera(deviceId) {

    if (currentStream) {

        currentStream
        .getTracks()
        .forEach(track =>
            track.stop()
        );

    }


    try {

        currentStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    deviceId: {
                        exact: deviceId
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                }

            });


        video.srcObject =
            currentStream;


        lastX = null;
        lastY = null;


    }

    catch (error) {

        console.error(error);

        alert(
            "カメラを起動できませんでした"
        );

    }

}


// =====================================================
// カメラ切り替え
// =====================================================

switchButton.onclick =
async function () {

    const options =
        Array.from(
            cameraSelect.options
        );


    if (options.length <= 1)
        return;


    let index =
        cameraSelect.selectedIndex;


    index++;


    if (index >= options.length)
        index = 0;


    cameraSelect.selectedIndex =
        index;


    await startCamera(
        cameraSelect.value
    );

};


cameraSelect.onchange =
function () {

    startCamera(
        cameraSelect.value
    );

};


// =====================================================
// 左右反転
// =====================================================

mirrorButton.onclick =
function () {

    mirrored =
        !mirrored;


    mirrorButton.textContent =
        mirrored
        ? "↔️ 反転 ON"
        : "↔️ 反転 OFF";


    lastX = null;
    lastY = null;

};


// =====================================================
// 削除モード
// =====================================================

deleteMode.onclick =
function () {

    deleting =
        !deleting;


    deleteMode.classList.toggle(
        "active",
        deleting
    );


    deleteMode.textContent =
        deleting
        ? "🧹 削除モード ON"
        : "🧹 削除モード";

};


// =====================================================
// 全消去
// =====================================================

clearButton.onclick =
function () {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

};


// =====================================================
// 色変更
// =====================================================

const colors = [

    {
        name: "黒",
        value: "black"
    },

    {
        name: "赤",
        value: "red"
    },

    {
        name: "青",
        value: "blue"
    },

    {
        name: "緑",
        value: "green"
    },

    {
        name: "オレンジ",
        value: "orange"
    },

    {
        name: "紫",
        value: "purple"
    }

];


let colorIndex = 0;


colorButton.onclick =
function () {

    colorIndex++;

    if (
        colorIndex >= colors.length
    ) {

        colorIndex = 0;

    }


    color =
        colors[colorIndex].value;


    colorButton.textContent =
        "🎨 " +
        colors[colorIndex].name;

};


// =====================================================
// ズーム表示
// =====================================================

zoomSlider.oninput =
function () {

    zoomValue.textContent =
        Number(
            zoomSlider.value
        ).toFixed(1)
        + "x";

};


// =====================================================
// MediaPipe Hands
// =====================================================

const hands =
    new Hands({

        locateFile:
        (file) => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.7,

    minTrackingConfidence: 0.7

});


// =====================================================
// 一時キャンバス
// =====================================================

const recognitionCanvas =
    document.createElement(
        "canvas"
    );

const recognitionCtx =
    recognitionCanvas.getContext(
        "2d"
    );


// =====================================================
// 手を認識
// =====================================================

hands.onResults(
function(results) {


    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        lastX = null;
        lastY = null;

        return;

    }


    const hand =
        results.multiHandLandmarks[0];


    // 人差し指先端
    const finger =
        hand[8];


    const zoom =
        parseFloat(
            zoomSlider.value
        );


    // -------------------------------------------------
    // MediaPipeの座標は
    // ズームされた認識範囲内の座標
    // -------------------------------------------------

    let nx =
        finger.x;

    let ny =
        finger.y;


    // -------------------------------------------------
    // 左右反転
    // -------------------------------------------------

    if (mirrored) {

        nx =
            1 - nx;

    }


    // -------------------------------------------------
    // キャンバス上の位置
    // -------------------------------------------------

    const x =
        nx *
        canvas.width;


    const y =
        ny *
        canvas.height;


    // -------------------------------------------------
    // 人差し指が伸びているか
    // -------------------------------------------------

    const isIndexUp =
        hand[8].y <
        hand[6].y;


    if (!isIndexUp) {

        lastX = null;
        lastY = null;

        return;

    }


    // -------------------------------------------------
    // 線を描く
    // -------------------------------------------------

    if (
        lastX !== null &&
        lastY !== null
    ) {

        ctx.beginPath();

        ctx.moveTo(
            lastX,
            lastY
        );

        ctx.lineTo(
            x,
            y
        );


        if (deleting) {

            ctx.globalCompositeOperation =
                "destination-out";

            ctx.lineWidth = 45;

        }

        else {

            ctx.globalCompositeOperation =
                "source-over";

            ctx.strokeStyle =
                color;

            ctx.lineWidth = 8;

        }


        ctx.lineCap =
            "round";


        ctx.stroke();


        ctx.globalCompositeOperation =
            "source-over";

    }


    lastX = x;
    lastY = y;

});


// =====================================================
// MediaPipeへ送る映像
// =====================================================

async function processCamera() {

    if (
        video.readyState >= 2 &&
        video.videoWidth > 0
    ) {

        const w =
            video.videoWidth;

        const h =
            video.videoHeight;


        const zoom =
            parseFloat(
                zoomSlider.value
            );


        // ---------------------------------------------
        // ズームする範囲
        // ---------------------------------------------

        const cropW =
            w / zoom;

        const cropH =
            h / zoom;


        // 中央から切り出す
        const cropX =
            (w - cropW) / 2;

        const cropY =
            (h - cropH) / 2;


        recognitionCanvas.width =
            w;

        recognitionCanvas.height =
            h;


        recognitionCtx.clearRect(
            0,
            0,
            w,
            h
        );


        // ---------------------------------------------
        // 中央部分を拡大して
        // MediaPipeに送る
        // ---------------------------------------------

        recognitionCtx.drawImage(

            video,

            cropX,
            cropY,
            cropW,
            cropH,

            0,
            0,
            w,
            h

        );


        await hands.send({

            image:
                recognitionCanvas

        });

    }


    requestAnimationFrame(
        processCamera
    );

}


// =====================================================
// 起動
// =====================================================

getCameras();

processCamera();

</script>

</body>
</html>
